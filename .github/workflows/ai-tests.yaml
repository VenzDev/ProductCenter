name: ai tests

on:
  push:
    paths:
      - "services/ai/**"
  pull_request:
    paths:
      - "services/ai/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements-dev.txt

      - run: pytest
