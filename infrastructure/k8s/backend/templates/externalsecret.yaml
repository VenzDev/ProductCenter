# Syncs all of backend-secrets from two sources — SSM Parameter Store (app secrets) and
# RDS's own Secrets Manager entry (db-password) — replacing what used to be manual
# `kubectl create secret generic --from-literal=...` steps entirely (docs/runbook.md).
# One ExternalSecret, not two: each `data[]` entry can override its SecretStore via
# `sourceRef.storeRef` (the AWS provider only supports one `service` — ParameterStore or
# SecretsManager — per SecretStore, hence still two SecretStores). Two separate
# ExternalSecrets both targeting backend-secrets was tried first and rejected by the
# controller (`SecretOwnedByOther` — a Secret can only be owned by one ExternalSecret,
# and `creationPolicy: Merge` alone never creates it — see docs/runbook.md #14/#15).
#
# All three resources here are also pre-install/pre-upgrade hooks, weighted before
# migrate-job.yaml's -5 — plain (non-hook) resources are only applied by Helm AFTER
# every hook finishes, so without this the migrate Job (which needs backend-secrets)
# would deadlock waiting on a Secret Helm hasn't gotten to creating yet.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ssm-backend
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-central-1
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secretsmanager-backend
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssm-backend
    kind: SecretStore
  target:
    name: backend-secrets
  data:
    - secretKey: app-key
      remoteRef:
        key: /product-center/backend/app-key
    - secretKey: azure-client-id
      remoteRef:
        key: /product-center/backend/azure-client-id
    - secretKey: azure-tenant-id
      remoteRef:
        key: /product-center/backend/azure-tenant-id
    - secretKey: azure-client-secret
      remoteRef:
        key: /product-center/backend/azure-client-secret
    - secretKey: azure-redirect-uri
      remoteRef:
        key: /product-center/backend/azure-redirect-uri
    - secretKey: azure-allowed-domain
      remoteRef:
        key: /product-center/backend/azure-allowed-domain
    - secretKey: stripe-secret
      remoteRef:
        key: /product-center/backend/stripe-secret
    - secretKey: stripe-webhook-secret
      remoteRef:
        key: /product-center/backend/stripe-webhook-secret
    - secretKey: openai-api-key
      remoteRef:
        key: /product-center/backend/openai-api-key
    - secretKey: db-password
      sourceRef:
        storeRef:
          name: secretsmanager-backend
          kind: SecretStore
      remoteRef:
        # RDS-generated ARN, only known after `terraform apply` (same reason
        # values.yaml's DB_HOST and ingress.certificateArn are also filled-in
        # placeholders, not hardcoded) — see infrastructure/eks/rds.tf.
        key: {{ .Values.dbSecretArn }}
        property: password
