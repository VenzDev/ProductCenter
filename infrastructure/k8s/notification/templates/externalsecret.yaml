# Syncs Mailgun credentials from SSM Parameter Store (infrastructure/ssm) into
# notification-secrets — read by this chart's own Deployment (values.yaml env). Own
# SecretStore, same reasoning as infrastructure/k8s/opensearch/templates/externalsecret.yaml
# (charts stay self-contained, no cross-release dependency). Requires External Secrets
# Operator already installed (docs/runbook.md).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ssm-notification
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-central-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssm-notification
    kind: SecretStore
  target:
    name: notification-secrets
  data:
    - secretKey: mailgun-domain
      remoteRef:
        key: /product-center/notification/mailgun-domain
    - secretKey: mailgun-api-key
      remoteRef:
        key: /product-center/notification/mailgun-api-key
    - secretKey: mailgun-sender
      remoteRef:
        key: /product-center/notification/mailgun-sender
