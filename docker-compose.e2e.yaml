name: product-center-e2e

services:
  backend-e2e:
    build:
      context: ./services/backend
      target: dev
    environment:
      SERVER_NAME: ":80"
      DB_DATABASE: backend_test
      CACHE_STORE: database
    volumes:
      - ./services/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend-e2e:
    build:
      context: ./services/frontend
      target: dev
    environment:
      BACKEND_URL: http://backend-e2e
    volumes:
      - ./services/frontend:/app
      - frontend_e2e_next:/app/.next
    depends_on:
      backend-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend-e2e:3000
    volumes:
      - ./e2e:/app
    command: sh -c "npm ci && npx playwright test"
    depends_on:
      frontend-e2e:
        condition: service_healthy

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3
    volumes:
      - ./services/backend/docker/localstack-init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: backend_test
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  frontend_e2e_next:
