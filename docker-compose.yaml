services:
  payment:
    build:
      context: ./services/payment
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - ./services/payment:/app

  backend:
    build:
      context: ./services/backend
      target: dev
    environment:
      SERVER_NAME: ":80"
    ports:
      - "8081:80"
    volumes:
      - ./services/backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  backend-worker:
    build:
      context: ./services/backend
      target: dev
    entrypoint: ["php", "artisan", "queue:work"]
    volumes:
      - ./services/backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      - ./services/backend/docker/localstack-init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  backend_vendor:
  postgres_data:
