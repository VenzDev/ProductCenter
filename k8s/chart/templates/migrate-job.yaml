{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}-migrate
  annotations:
    # Runs before the Deployment rolls out, on every install AND upgrade — without this,
    # a fresh database has no tables and every request 500s (including /health), since
    # the default "web" middleware group starts a session against a sessions table that
    # doesn't exist yet. hook-succeeded (not before-hook-creation alone) means a failed
    # migration job is left behind for `kubectl logs`/`kubectl describe` instead of being
    # silently replaced by the next retry.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: {{ .Values.name }}-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.image }}
          command: ["php", "artisan", "migrate", "--force"]
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
