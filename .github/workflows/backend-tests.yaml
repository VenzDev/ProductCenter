name: backend tests

on:
  push:
    paths:
      - "services/backend/**"
  pull_request:
    paths:
      - "services/backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: backend_test
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: backend
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U backend -d backend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - "9200:9200"
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: apcu, intl, zip, gd, pcntl, pdo_pgsql
          ini-values: apc.enable_cli=1
          coverage: none

      - run: cp .env.example .env

      - run: composer install --no-interaction --prefer-dist

      # phpstan boots the real app to resolve facade methods (e.g. JWTAuth::fromUser),
      # which needs a real secret — unlike pest, this doesn't use phpunit.xml's env.
      - run: php artisan jwt:secret --force

      - run: ./vendor/bin/pest
        env:
          DB_HOST: 127.0.0.1
          OPENSEARCH_HOST: http://127.0.0.1:9200

      - run: ./vendor/bin/phpstan analyse --memory-limit=512M
