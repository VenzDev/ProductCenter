name: test · backend

on:
  push:
    paths:
      - "services/backend/**"
      - "docker-compose.test.yaml"
  pull_request:
    paths:
      - "services/backend/**"
      - "docker-compose.test.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker compose -f docker-compose.test.yaml build backend_test

      - run: docker compose -f docker-compose.test.yaml up -d --wait postgres_test redis_test opensearch_test localstack_test

      - run: docker compose -f docker-compose.test.yaml run --rm --entrypoint sh backend_test -c "composer install --no-interaction"

      - run: docker compose -f docker-compose.test.yaml up -d --wait backend_test

      - run: docker compose -f docker-compose.test.yaml exec backend_test php artisan test

      - run: docker compose -f docker-compose.test.yaml exec backend_test ./vendor/bin/phpstan analyse --memory-limit=512M

      - if: failure()
        run: docker compose -f docker-compose.test.yaml logs

      - if: always()
        run: docker compose -f docker-compose.test.yaml down -v
