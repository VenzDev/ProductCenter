services:
  ai:
    build:
      context: ./services/ai
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./services/ai/app:/app/app
      - ./services/ai/tests:/app/tests

  payment:
    build:
      context: ./services/payment
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - ./services/payment:/app

  backend:
    build:
      context: ./services/backend
      target: dev
    environment:
      SERVER_NAME: ":80"
    ports:
      - "8081:80"
    volumes:
      - ./services/backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  backend_vendor:
  postgres_data:
