# Syncs the OpenSearch admin password from SSM Parameter Store (infrastructure/ssm) into
# opensearch-secrets — read by this chart's own Deployment
# (OPENSEARCH_INITIAL_ADMIN_PASSWORD) and, cross-chart, by the backend's
# (OPENSEARCH_PASSWORD, see infrastructure/k8s/backend/values.yaml). Own SecretStore
# rather than reusing backend's ssm-backend — charts stay self-contained, no
# cross-release dependency (see docs/runbook.md step 0). Requires External Secrets
# Operator already installed (docs/runbook.md).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ssm-opensearch
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-central-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-admin-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssm-opensearch
    kind: SecretStore
  target:
    name: opensearch-secrets
    # Owner (default) — the only ExternalSecret targeting this Secret, so it must be the
    # one to create it. Merge only merges into an already-existing Secret; used alone
    # (as this was before) it leaves the Secret never created — see docs/runbook.md.
  data:
    - secretKey: admin-password
      remoteRef:
        key: /product-center/opensearch/admin-password
