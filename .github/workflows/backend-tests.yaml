name: backend tests

on:
  push:
    paths:
      - "services/backend/**"
  pull_request:
    paths:
      - "services/backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: apcu, intl, zip
          ini-values: apc.enable_cli=1
          coverage: none

      - run: cp .env.example .env

      - run: composer install --no-interaction --prefer-dist

      # phpstan boots the real app to resolve facade methods (e.g. JWTAuth::fromUser),
      # which needs a real secret — unlike pest, this doesn't use phpunit.xml's env.
      - run: php artisan jwt:secret --force

      - run: ./vendor/bin/pest

      - run: ./vendor/bin/phpstan analyse --memory-limit=512M
