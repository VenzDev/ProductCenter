name: build · frontend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push alongside the commit SHA"
        default: latest

permissions:
  id-token: write # assume the ECR-push role via OIDC
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
      AWS_ROLE_ARN: arn:aws:iam::222634367938:role/product-center-github-actions-ecr
      ECR_REPOSITORY: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build, then scan, then push — a CRITICAL/HIGH finding blocks the push.
      - name: Build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ inputs.tag }}
        run: |
          STRIPE_PUBLISHABLE_KEY=$(aws ssm get-parameter \
            --name /product-center/frontend/stripe-publishable-key \
            --query Parameter.Value --output text)
          docker build --target prod \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" \
            -t "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            -t "$REGISTRY/$ECR_REPOSITORY:$TAG" \
            services/frontend

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ inputs.tag }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
