services:
  frontend:
    build:
      context: ./services/frontend
      target: dev
    environment:
      BACKEND_URL: http://backend
    ports:
      - "3000:3000"
    volumes:
      - ./services/frontend:/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  payment:
    build:
      context: ./services/payment
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - ./services/payment:/app

  backend:
    build:
      context: ./services/backend
      target: dev
    environment:
      SERVER_NAME: ":80"
    ports:
      - "8081:80"
    volumes:
      - ./services/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend-worker:
    build:
      context: ./services/backend
      target: dev
    entrypoint: ["php", "artisan", "queue:work"]
    # A fatal error in one job (e.g. an out-of-memory PDF parse) kills the whole
    # queue:work process, not just that job — restart so it keeps processing the rest.
    restart: unless-stopped
    volumes:
      - ./services/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      - ./services/backend/docker/localstack-init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/backend/docker/postgres-init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
