name: test · notification

on:
  pull_request:
    paths:
      - "services/notification/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/notification/go.mod

      - run: go test ./...
